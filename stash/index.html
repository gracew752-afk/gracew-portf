<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE STASH</title>
<meta name="description" content="THE STASH — a curated vault of 200+ free tools, assets, fonts, mockups & design resources, hand-picked by Grace Williams.">
<meta name="theme-color" content="#ff3b8d">
<meta property="og:title" content="THE STASH">
<meta property="og:description" content="200+ hand-picked free tools, assets & design resources.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gracew.co/stash">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --accent:#ff3b8d;
    --accent-2:#ff5fa2;
    --win-bg:#ffffff;
    --title-bg:rgba(246,246,248,0.80);
    --sidebar-bg:rgba(238,238,242,0.72);
    --content-bg:#ffffff;
    --head-bg:rgba(255,255,255,0.85);
    --text:#1d1d1f;
    --text-2:#86868b;
    --text-3:#a1a1a6;
    --hairline:rgba(0,0,0,0.08);
    --row-hover:rgba(0,0,0,0.035);
    --sb-hover:rgba(0,0,0,0.055);
    --icon-bg:rgba(0,0,0,0.055);
    --field-bg:#f0f0f2;
    --field-border:rgba(0,0,0,0.10);
    --desktop:linear-gradient(135deg,#f6dcea 0%,#ece3f0 55%,#e6e6ec 100%);
    --shadow:0 30px 70px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --win-bg:#1e1e1e;
      --title-bg:rgba(48,48,50,0.80);
      --sidebar-bg:rgba(38,38,41,0.70);
      --content-bg:#1e1e1e;
      --head-bg:rgba(30,30,30,0.85);
      --text:#f5f5f7;
      --text-2:#98989d;
      --text-3:#8a8a8e;
      --hairline:rgba(255,255,255,0.10);
      --row-hover:rgba(255,255,255,0.05);
      --sb-hover:rgba(255,255,255,0.07);
      --icon-bg:rgba(255,255,255,0.09);
      --field-bg:#2c2c2e;
      --field-border:rgba(255,255,255,0.14);
      --desktop:linear-gradient(135deg,#2b2530 0%,#221f27 55%,#1b1b1f 100%);
      --shadow:0 30px 70px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
    background:var(--desktop);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 20px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- window ---------- */
  .window{
    width:100%;
    max-width:1060px;
    height:min(780px,86vh);
    background:var(--win-bg);
    border-radius:12px;
    box-shadow:var(--shadow);
    border:0.5px solid var(--hairline);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- title bar ---------- */
  .titlebar{
    position:relative;
    height:52px;
    flex:0 0 52px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    background:var(--title-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:0.5px solid var(--hairline);
  }
  .lights{display:flex;gap:8px;align-items:center;}
  .light{width:12px;height:12px;border-radius:50%;border:0.5px solid rgba(0,0,0,0.12);}
  .light.r{background:#ff5f57;}
  .light.y{background:#febc2e;}
  .light.g{background:#28c840;}
  .title{
    position:absolute;
    left:50%;transform:translateX(-50%);
    font-size:13px;font-weight:600;letter-spacing:0.16em;
    color:var(--text-2);
    pointer-events:none;
  }
  .search-wrap{
    margin-left:auto;
    display:flex;align-items:center;gap:6px;
    background:var(--field-bg);
    border:0.5px solid var(--field-border);
    border-radius:7px;
    padding:5px 9px;
    width:210px;
  }
  .search-wrap svg{flex:0 0 13px;opacity:0.5;}
  #search{
    border:none;background:none;outline:none;
    font-family:inherit;font-size:13px;color:var(--text);
    width:100%;
  }
  #search::placeholder{color:var(--text-3);}

  /* ---------- promo / upsell bar ---------- */
  .promo{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff;text-decoration:none;
    font-size:13px;
    border-bottom:0.5px solid rgba(0,0,0,0.06);
    transition:filter 0.12s ease;
  }
  .promo:hover{filter:brightness(1.05);}
  .promo-text{opacity:0.96;}
  .promo-text b{font-weight:700;}
  .promo-cta{
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.55);
    padding:4px 13px;border-radius:999px;font-weight:700;white-space:nowrap;
  }

  /* ---------- body row ---------- */
  .body-row{flex:1;display:flex;min-height:0;}

  /* ---------- sidebar ---------- */
  .sidebar{
    flex:0 0 218px;
    background:var(--sidebar-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-right:0.5px solid var(--hairline);
    padding:12px 10px;
    overflow-y:auto;
  }
  .sb-section{
    font-size:11px;font-weight:600;
    color:var(--text-3);
    padding:12px 10px 5px;
    letter-spacing:0.01em;
  }
  .sb-section:first-child{padding-top:4px;}
  .sb-item{
    display:flex;align-items:center;gap:9px;
    width:100%;
    padding:6px 10px;
    border:none;background:none;
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;font-size:13px;
    color:var(--text);
    text-align:left;
    transition:background 0.12s ease;
  }
  .sb-item:hover{background:var(--sb-hover);}
  .sb-item.active{background:var(--accent);color:#fff;}
  .sb-emoji{font-size:15px;line-height:1;width:18px;text-align:center;}
  .sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sb-count{
    font-size:11.5px;color:var(--text-3);
    font-variant-numeric:tabular-nums;
  }
  .sb-item.active .sb-count{color:rgba(255,255,255,0.85);}

  /* ---------- content ---------- */
  .content{flex:1;min-width:0;background:var(--content-bg);overflow-y:auto;position:relative;}
  .content-head{
    position:sticky;top:0;z-index:3;
    display:flex;align-items:center;gap:12px;
    padding:16px 22px 12px;
    background:var(--head-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:0.5px solid var(--hairline);
  }
  .content-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .tool-btn{
    background:var(--field-bg);color:var(--text);
    border:0.5px solid var(--field-border);border-radius:7px;
    font-family:inherit;font-size:12.5px;font-weight:500;
    padding:6px 12px;cursor:pointer;
    transition:background 0.12s ease;
  }
  .tool-btn:hover{background:var(--row-hover);}
  .add-btn{
    background:var(--accent);color:#fff;
    border:none;border-radius:7px;
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:6px 13px;cursor:pointer;
    transition:filter 0.12s ease;
  }
  .add-btn:hover{filter:brightness(1.06);}

  /* ---------- add form ---------- */
  .add-form{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:11px;
    padding:16px 22px;
    border-bottom:0.5px solid var(--hairline);
    background:var(--field-bg);
  }
  .add-form.open{display:grid;}
  .add-form .full{grid-column:1 / -1;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;font-weight:600;color:var(--text-2);}
  .field input, .field textarea{
    font-family:inherit;font-size:13px;color:var(--text);
    background:var(--win-bg);
    border:0.5px solid var(--field-border);
    border-radius:7px;padding:8px 10px;outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,59,141,0.15);}
  .field textarea{resize:vertical;min-height:40px;}
  .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;}
  .btn-save{background:var(--accent);color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 15px;cursor:pointer;}
  .btn-cancel{background:transparent;color:var(--text-2);border:0.5px solid var(--field-border);border-radius:7px;font-family:inherit;font-size:12.5px;padding:7px 15px;cursor:pointer;}

  /* ---------- rows ---------- */
  .group-head{
    font-size:11px;font-weight:700;
    color:var(--text-3);
    text-transform:uppercase;letter-spacing:0.04em;
    padding:16px 22px 6px;
  }
  .row{
    display:flex;align-items:center;gap:12px;
    padding:9px 22px;
    border-bottom:0.5px solid var(--hairline);
    transition:background 0.1s ease;
  }
  .row:hover{background:var(--row-hover);}
  .row-icon{
    flex:0 0 30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    background:var(--icon-bg);border-radius:7px;
    font-size:16px;
  }
  .row-main{flex:1;min-width:0;}
  .row-title{
    font-size:13.5px;font-weight:600;color:var(--text);
    text-decoration:none;
    display:inline-block;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;
  }
  .row-title:hover{color:var(--accent);}
  .row-note{
    font-size:12px;color:var(--text-2);
    margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .row-domain{
    flex:0 0 auto;
    font-size:11.5px;color:var(--text-3);
    text-decoration:none;
    white-space:nowrap;
  }
  .row-domain:hover{color:var(--accent);}
  .row-del{
    flex:0 0 auto;
    background:none;border:none;cursor:pointer;
    color:var(--text-3);font-size:13px;line-height:1;
    padding:4px 5px;border-radius:5px;
    opacity:0;transition:opacity 0.1s ease, background 0.1s ease, color 0.1s ease;
  }
  .row:hover .row-del{opacity:1;}
  .row-del:hover{background:var(--row-hover);color:var(--accent);}

  .empty{
    padding:70px 22px;text-align:center;
    color:var(--text-3);font-size:13px;
  }

  @media (max-width:640px){
    body{padding:0;}
    .window{height:100vh;border-radius:0;max-width:none;}
    .sidebar{flex-basis:170px;}
    .add-form{grid-template-columns:1fr;}
    .row-domain{display:none;}
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
    <div class="title">THE STASH</div>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Search" />
    </div>
  </div>

  <a class="promo" href="https://gracebrandingco.gumroad.com/l/xbkolx" target="_blank" rel="noopener">
    <span class="promo-text">You're browsing the <b>free taste</b> — the full vault has <b>200+</b> hand-picked finds.</span>
    <span class="promo-cta">Get the full vault →</span>
  </a>

  <div class="body-row">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content">
      <div class="content-head">
        <h2 id="contentTitle">All Finds</h2>
        <div class="head-actions">
          <button class="tool-btn" id="importBtn" title="Import a stash backup">Import</button>
          <button class="tool-btn" id="exportBtn" title="Download your stash as a backup">Export</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
          <button class="add-btn" id="toggleForm">+ Add</button>
        </div>
      </div>

      <form class="add-form" id="addForm">
        <div class="field">
          <label for="f-title">Name</label>
          <input id="f-title" type="text" placeholder="e.g. Cobalt" required />
        </div>
        <div class="field">
          <label for="f-url">Link</label>
          <input id="f-url" type="text" placeholder="https://..." required />
        </div>
        <div class="field full">
          <label for="f-cat">Category</label>
          <input id="f-cat" list="cat-options" type="text" placeholder="e.g. Free Assets" required />
          <datalist id="cat-options"></datalist>
        </div>
        <div class="field full">
          <label for="f-note">Why it's good (optional)</label>
          <textarea id="f-note" placeholder="quick note to future you"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancelForm">Cancel</button>
          <button type="submit" class="btn-save">Save find</button>
        </div>
      </form>

      <div id="rows"></div>
      <div class="empty" id="emptyState" style="display:none;">Nothing here yet — add your first find.</div>
    </main>
  </div>
</div>

<script>
const CAT_EMOJI = {
  "Free Assets": "🎨",
  "Software & Tools": "🛠️",
  "Learning & Courses": "🎓",
  "Money Savers": "💸",
  "Fonts": "🔤",
  "Mockups": "🖼️",
  "Design Tools": "🧰",
  "Design Inspo": "💡",
  "Portfolios & Studios": "🧑‍🎨",
  "Career": "💼",
  "Legal & Biz": "⚖️",
  "Misc / Cool": "✨"
};

function mk(id, title, url, category, note){
  return { id, title, url, category, note, emoji: CAT_EMOJI[category] || "📌" };
}

// FREE TEASER — a ~25-find taste of the full 200+ vault (sold on Gumroad)
const SEED = [
  mk("seed-1", "Unsplash", "https://unsplash.com/", "Free Assets", "Free high-res stock photos."),
  mk("seed-2", "Pexels", "https://www.pexels.com/", "Free Assets", "Free stock photos & videos."),
  mk("seed-3", "Texture Labs", "https://texturelabs.org/", "Free Assets", "My favorite — free high-res textures."),
  mk("seed-4", "Humaaans", "https://www.humaaans.com/", "Free Assets", "Free customizable human illustrations."),

  mk("seed-5", "Google Fonts", "https://fonts.google.com/", "Fonts", "The free font library."),
  mk("seed-6", "FontShare", "https://www.fontshare.com/", "Fonts", "Free, genuinely gorgeous fonts."),
  mk("seed-7", "Uncut", "https://uncut.wtf/", "Fonts", "Curated free fonts."),

  mk("seed-8", "Mr Mockup", "https://mrmockup.com/free-mockups/", "Mockups", "Goated free mockup source."),
  mk("seed-9", "Anthony Boyd", "https://www.anthonyboyd.graphics/mockups/", "Mockups", "Really good free mockups."),
  mk("seed-10", "Unblast", "https://unblast.com/mockups/", "Mockups", "Free mockups & design resources."),

  mk("seed-11", "Coolors", "https://coolors.co/", "Design Tools", "Palette generator."),
  mk("seed-12", "Fontjoy", "https://www.fontjoy.com", "Design Tools", "Font pairing generator."),
  mk("seed-13", "Typescale", "https://www.typescale.com", "Design Tools", "Quick type sizing tool."),

  mk("seed-14", "Awwwards", "https://www.awwwards.com/", "Design Inspo", "Website design awards & inspo."),
  mk("seed-15", "Mobbin", "https://mobbin.com", "Design Inspo", "UI/UX inspo library."),
  mk("seed-16", "Savee It", "https://savee.it/", "Design Inspo", "Pinterest alternative."),
  mk("seed-17", "Cosmos", "https://www.cosmos.so/", "Design Inspo", "Pinterest alternative."),

  mk("seed-18", "Pentagram", "https://www.pentagram.com/", "Portfolios & Studios", "World's largest design studio."),
  mk("seed-19", "Bestfolios", "https://www.bestfolios.com/home", "Portfolios & Studios", "Portfolio inspo."),

  mk("seed-20", "Method of Action", "https://method.ac/", "Learning & Courses", "Design skill-building games."),
  mk("seed-21", "Type Method", "https://type.method.ac/", "Learning & Courses", "Kerning type game."),

  mk("seed-22", "AIGA", "https://www.aiga.org/", "Career", "American Institute of Graphic Arts."),
  mk("seed-23", "Aquent Salary Guide", "https://aquent.com/lp/salary-guide", "Career", "Salary transparency guide."),

  mk("seed-24", "DaVinci Resolve", "https://www.blackmagicdesign.com/products/davinciresolve", "Software & Tools", "Free pro-grade editor with Hollywood color grading."),
  mk("seed-25", "Cobalt", "https://cobalt.tools/", "Software & Tools", "Free downloader for video/audio from almost any site."),

  mk("seed-26", "Trademarkia", "https://www.trademarkia.com/", "Legal & Biz", "Check your logo for trademark conflicts.")
];
let resources = [];
let activeFilter = 'All';

const sidebarEl = document.getElementById('sidebar');
const rowsEl = document.getElementById('rows');
const contentTitle = document.getElementById('contentTitle');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('search');
const addForm = document.getElementById('addForm');
const toggleBtn = document.getElementById('toggleForm');
const cancelBtn = document.getElementById('cancelForm');
const catDatalist = document.getElementById('cat-options');

const SEED_VERSION = 2; // bump when SEED gains new default finds

async function loadResources(){
  let stored = null;
  let storedVersion = 0;

  try{
    const raw = localStorage.getItem('stash_resources');
    stored = raw ? JSON.parse(raw) : null;
  }catch(err){ /* nothing saved yet */ }

  try{
    const v = localStorage.getItem('stash_seedVersion');
    storedVersion = v ? parseInt(v, 10) : 0;
  }catch(err){ /* no version saved yet */ }

  if(!stored){
    resources = SEED;
  } else if(storedVersion < SEED_VERSION){
    const custom = stored.filter(r => r.id && r.id.startsWith('r-'));
    resources = [...SEED, ...custom];
  } else {
    resources = stored;
  }

  saveResources();
  render();
}

function saveResources(){
  try{
    localStorage.setItem('stash_resources', JSON.stringify(resources));
    localStorage.setItem('stash_seedVersion', String(SEED_VERSION));
  }catch(err){
    console.error('Could not save:', err);
  }
}

function uniqueCategories(){
  return [...new Set(resources.map(r => r.category))].sort();
}

function categoryCounts(){
  const counts = {};
  resources.forEach(r => { counts[r.category] = (counts[r.category] || 0) + 1; });
  return counts;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function displayUrl(url){
  try{
    return new URL(url).hostname.replace('www.','');
  }catch(e){
    return url;
  }
}

/* ---------- sidebar ---------- */
function sidebarItem(cat, emoji, name, count){
  const active = (activeFilter === cat && !searchInput.value.trim()) ? ' active' : '';
  return `<button class="sb-item${active}" data-cat="${escapeHtml(cat)}">
    <span class="sb-emoji">${emoji}</span>
    <span class="sb-name">${escapeHtml(name)}</span>
    <span class="sb-count">${count}</span>
  </button>`;
}

function renderSidebar(){
  const cats = uniqueCategories();
  const counts = categoryCounts();
  let html = `<div class="sb-section">Library</div>`;
  html += sidebarItem('All', '✨', 'All Finds', resources.length);
  html += `<div class="sb-section">Categories</div>`;
  cats.forEach(c => { html += sidebarItem(c, CAT_EMOJI[c] || '📌', c, counts[c]); });
  sidebarEl.innerHTML = html;

  sidebarEl.querySelectorAll('.sb-item').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.cat;
      searchInput.value = '';
      render();
      document.querySelector('.content').scrollTo({top:0, behavior:'smooth'});
    });
  });

  catDatalist.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
}

/* ---------- rows ---------- */
function rowEl(r){
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <span class="row-icon">${CAT_EMOJI[r.category] || '📌'}</span>
    <div class="row-main">
      <a class="row-title" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>
      ${r.note ? `<div class="row-note">${escapeHtml(r.note)}</div>` : ''}
    </div>
    <a class="row-domain" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(displayUrl(r.url))} ↗</a>
    <button class="row-del" title="Remove" data-id="${r.id}">✕</button>
  `;
  return row;
}

function render(){
  renderSidebar();
  const q = searchInput.value.trim().toLowerCase();

  let list, title;
  if(q){
    list = resources.filter(r => r.title.toLowerCase().includes(q) || (r.note || '').toLowerCase().includes(q));
    title = `Search — ${list.length} result${list.length === 1 ? '' : 's'}`;
  } else if(activeFilter === 'All'){
    list = resources;
    title = 'All Finds';
  } else {
    list = resources.filter(r => r.category === activeFilter);
    title = activeFilter;
  }

  contentTitle.textContent = title;
  emptyState.style.display = list.length === 0 ? 'block' : 'none';
  rowsEl.innerHTML = '';

  // Group by category only in the unfiltered "All Finds" view
  if(!q && activeFilter === 'All'){
    uniqueCategories().forEach(cat => {
      const items = list.filter(r => r.category === cat);
      if(!items.length) return;
      const head = document.createElement('div');
      head.className = 'group-head';
      head.textContent = `${CAT_EMOJI[cat] || '📌'}  ${cat}`;
      rowsEl.appendChild(head);
      items.forEach(r => rowsEl.appendChild(rowEl(r)));
    });
  } else {
    list.forEach(r => rowsEl.appendChild(rowEl(r)));
  }

  bindDelete();
}

function bindDelete(){
  rowsEl.querySelectorAll('.row-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      resources = resources.filter(r => r.id !== id);
      saveResources();
      render();
    });
  });
}

/* ---------- events ---------- */
searchInput.addEventListener('input', render);

toggleBtn.addEventListener('click', () => addForm.classList.toggle('open'));
cancelBtn.addEventListener('click', () => {
  addForm.classList.remove('open');
  addForm.reset();
});

addForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const title = document.getElementById('f-title').value.trim();
  let url = document.getElementById('f-url').value.trim();
  const category = document.getElementById('f-cat').value.trim();
  const note = document.getElementById('f-note').value.trim();

  if(!title || !url || !category) return;
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  resources.unshift({
    id: 'r-' + Date.now(),
    title, url, category, note,
    emoji: CAT_EMOJI[category] || '📌'
  });

  saveResources();
  addForm.reset();
  addForm.classList.remove('open');
  activeFilter = category;
  searchInput.value = '';
  render();
});

/* ---------- export / import ---------- */
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');

exportBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(resources, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'the-stash-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

importBtn.addEventListener('click', () => importFile.click());

importFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data) || !data.every(r => r && r.title && r.url && r.category)){
        alert('That file doesn’t look like a stash backup.');
        return;
      }
      if(confirm(`Replace your current stash with ${data.length} finds from this backup?`)){
        resources = data;
        activeFilter = 'All';
        searchInput.value = '';
        saveResources();
        render();
      }
    }catch(err){
      alert('Could not read that file — is it a valid stash backup?');
    }finally{
      importFile.value = '';
    }
  };
  reader.readAsText(file);
});

loadResources();
</script>
</body>
</html>
